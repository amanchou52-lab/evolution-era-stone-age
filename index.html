<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution Era — Stone Age Testing</title>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="level-up-flash"></div>

<div id="header">
    <h1>⚗️ EVOLUTION ERA <span class="era-tag">— Stone Age</span></h1>
    <div id="player-stats">
        <div class="stat-pill"><span class="icon">⚔️</span> Lvl <span class="val" id="hdr-level">1</span></div>
        <div class="stat-pill"><span class="icon">🪙</span> <span class="val" id="hdr-kodi">0</span> Kodi</div>
        <div id="xp-bar-wrap">
            <div id="xp-bar" style="width:0%"></div>
            <div id="xp-text">0 / 100 XP</div>
        </div>
        <div class="stat-pill"><span class="icon">🎯</span> SP: <span class="val" id="hdr-sp">0</span></div>
    </div>
</div>

<div id="main-layout">

    <div class="panel" id="left-panel">
        <div class="panel-title">📦 Tribal Bag</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('seeds')">Seeds</button>
            <button class="tab-btn" onclick="switchTab('crops')">Crops</button>
            <button class="tab-btn" onclick="switchTab('food')">Food</button>
            <button class="tab-btn" onclick="switchTab('skills')">Skills</button>
        </div>

        <div class="tab-content active" id="tab-seeds"><div class="inv-grid" id="seed-inv"></div></div>
        <div class="tab-content" id="tab-crops"><div class="inv-grid" id="crop-inv"></div></div>
        <div class="tab-content" id="tab-food"><div id="food-inv"></div></div>
        <div class="tab-content" id="tab-skills">
            <div class="sp-bar">Skill Points: <span id="sp-display">0</span> <button class="btn-danger-small" onclick="triggerReset()">Reset</button></div>
            <div class="skill-tree-container" id="skill-tree"></div>
        </div>
    </div>

    <div id="center-game">
        <div id="phaser-canvas-container">
            </div>
        
        <div class="sub-section" id="cooking-section">
            <div class="section-title">🔥 Tribal Fire & Cooking</div>
            <div id="buildings-container"></div>
        </div>

        <div class="sub-section" id="market-section">
            <div class="section-title">🛒 Tribal Bazaar</div>
            <div id="market-container"></div>
        </div>
    </div>

    <div class="panel" id="right-panel">
        <div class="panel-title">👥 Tribal Elders</div>
        <div id="npc-container"></div>

        <div class="panel-title" style="margin-top: 20px;">📜 Action Log</div>
        <div id="action-log"></div>
    </div>

</div>

<div id="modal-overlay">
    <div id="modal">
        <div id="modal-title"></div>
        <div id="modal-subtitle"></div>
        <div id="modal-body"></div>
        <div class="modal-actions" id="modal-actions"></div>
    </div>
</div>

<div id="toast-container"></div>

<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>

</body>
</html>
