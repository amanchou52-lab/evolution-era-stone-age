<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evolution Era — Stone Age</title>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0d0a06;
    --bg-mid: #1a1208;
    --bg-panel: #1f1810;
    --bg-card: #2a2015;
    --border: #6b4c1e;
    --border-light: #a07030;
    --gold: #d4a017;
    --gold-light: #f0c040;
    --green: #4a8c3f;
    --green-light: #6bc25e;
    --red: #8c2f2f;
    --red-light: #c94444;
    --stone: #7a6a55;
    --stone-light: #a89880;
    --iron: #5a6a7a;
    --iron-light: #8aaabb;
    --wood: #8b5e2a;
    --wood-light: #c48840;
    --text: #e8d5a0;
    --text-dim: #a09060;
    --text-bright: #fff5d0;
    --shadow: 0 4px 20px rgba(0,0,0,0.8);
    --glow-gold: 0 0 15px rgba(212,160,23,0.4);
    --glow-green: 0 0 15px rgba(74,140,63,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Crimson Text', serif;
    font-size: 16px;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(139,94,42,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(74,140,63,0.06) 0%, transparent 50%);
  }

  /* ── HEADER ── */
  #header {
    background: linear-gradient(180deg, #0a0804 0%, var(--bg-mid) 100%);
    border-bottom: 2px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow);
  }

  #header h1 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(212,160,23,0.5);
    letter-spacing: 2px;
  }

  #header h1 span { color: var(--text-dim); font-size: 14px; font-weight: 400; }

  #player-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .stat-pill {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 14px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stat-pill .icon { font-size: 16px; }
  .stat-pill .val { color: var(--gold-light); font-weight: 600; }

  /* XP Bar */
  #xp-bar-wrap {
    width: 200px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    height: 22px;
    overflow: hidden;
    position: relative;
  }

  #xp-bar {
    height: 100%;
    background: linear-gradient(90deg, #4a6020, var(--green-light));
    transition: width 0.5s ease;
    border-radius: 10px;
  }

  #xp-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: #fff;
    text-shadow: 0 1px 3px #000;
    white-space: nowrap;
  }

  /* ── MAIN LAYOUT ── */
  #main {
    display: grid;
    grid-template-columns: 260px 1fr 260px;
    gap: 0;
    min-height: calc(100vh - 55px);
  }

  /* ── PANELS ── */
  .panel {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
    max-height: calc(100vh - 55px);
  }

  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }

  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  /* ── CENTER GAME AREA ── */
  #game-area {
    background: var(--bg-mid);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    overflow-y: auto;
    max-height: calc(100vh - 55px);
  }

  /* ── ISLAND GRID ── */
  #island-container {
    position: relative;
  }

  #island-title {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    color: var(--gold);
    text-align: center;
    margin-bottom: 12px;
    text-shadow: var(--glow-gold);
  }

  #island-grid {
    display: grid;
    grid-template-columns: repeat(5, 90px);
    grid-template-rows: repeat(5, 90px);
    gap: 6px;
  }

  .island-cell {
    width: 90px;
    height: 90px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    font-size: 11px;
    text-align: center;
  }

  .island-cell:hover:not(.locked):not(.empty-locked) {
    border-color: var(--gold);
    box-shadow: var(--glow-gold);
    transform: translateY(-2px);
  }

  .island-cell.locked {
    background: #0e0b07;
    border-color: #3a2a10;
    cursor: not-allowed;
    opacity: 0.5;
  }

  .island-cell.locked::after {
    content: '🔒';
    font-size: 22px;
  }

  .island-cell.home-plot {
    border-color: var(--gold);
    background: linear-gradient(135deg, #2a1f08, #1a1408);
    box-shadow: var(--glow-gold);
  }

  .island-cell.has-crop { background: linear-gradient(135deg, #1a2a10, #0f1a08); border-color: var(--green); }
  .island-cell.ready { border-color: var(--green-light); animation: pulse-green 1.5s infinite; }
  .island-cell.wilted { border-color: var(--red); background: linear-gradient(135deg, #2a1010, #1a0808); }
  .island-cell.wood-node { background: linear-gradient(135deg, #2a1a08, #1a1008); border-color: var(--wood); }
  .island-cell.stone-node { background: linear-gradient(135deg, #1a1a1a, #101010); border-color: var(--stone); }
  .island-cell.iron-node { background: linear-gradient(135deg, #0a1020, #080c18); border-color: var(--iron); }

  @keyframes pulse-green {
    0%,100% { box-shadow: 0 0 5px rgba(107,194,94,0.3); }
    50% { box-shadow: 0 0 20px rgba(107,194,94,0.8); }
  }

  .cell-emoji { font-size: 26px; line-height: 1; }
  .cell-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .cell-timer { font-size: 9px; color: var(--gold); font-family: 'Cinzel', serif; }

  .progress-bar-wrap {
    position: absolute;
    bottom: 4px;
    left: 4px;
    right: 4px;
    height: 4px;
    background: rgba(0,0,0,0.5);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--green-light);
    transition: width 1s linear;
    border-radius: 2px;
  }

  /* ── COOKING SECTION ── */
  #cooking-section {
    width: 100%;
    max-width: 480px;
  }

  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }

  .cooking-building {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .building-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .building-emoji { font-size: 28px; }

  .building-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    color: var(--gold-light);
  }

  .building-status { font-size: 11px; color: var(--text-dim); }

  .recipe-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .recipe-btn {
    background: var(--bg-mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    color: var(--text);
    font-family: 'Crimson Text', serif;
  }

  .recipe-btn:hover:not(:disabled) {
    border-color: var(--gold);
    background: var(--bg-card);
    box-shadow: var(--glow-gold);
  }

  .recipe-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .recipe-btn .r-emoji { font-size: 20px; }
  .recipe-btn .r-name { font-size: 10px; color: var(--text-dim); display: block; margin-top: 2px; }
  .recipe-btn .r-xp { font-size: 11px; color: var(--green-light); font-weight: 600; }

  /* ── INVENTORY (Left Panel) ── */
  .inv-section { margin-bottom: 16px; }
  .inv-section-title { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }

  .inv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }

  .inv-item {
    background: var(--bg-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 4px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .inv-item:hover { border-color: var(--gold); }
  .inv-item .i-emoji { font-size: 18px; }
  .inv-item .i-count { font-size: 10px; color: var(--gold-light); font-family: 'Cinzel', serif; font-weight: 600; }
  .inv-item .i-name { font-size: 9px; color: var(--text-dim); }

  /* ── RIGHT PANEL ── */
  .npc-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .npc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .npc-avatar { font-size: 30px; }
  .npc-name { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold-light); }
  .npc-wants { font-size: 11px; color: var(--text-dim); }

  .npc-order {
    background: var(--bg-mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 12px;
    margin-bottom: 8px;
  }

  .deliver-btn {
    width: 100%;
    background: linear-gradient(135deg, #2a4a1a, #1a3010);
    border: 1px solid var(--green);
    color: var(--green-light);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    padding: 7px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .deliver-btn:hover:not(:disabled) { background: linear-gradient(135deg, #3a6a2a, #2a4a1a); box-shadow: var(--glow-green); }
  .deliver-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── MODAL ── */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  #modal-overlay.show { display: flex; }

  #modal {
    background: var(--bg-panel);
    border: 2px solid var(--border-light);
    border-radius: 16px;
    padding: 24px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 0 40px rgba(0,0,0,0.9), var(--glow-gold);
    animation: modal-in 0.25s ease;
  }

  @keyframes modal-in {
    from { transform: scale(0.85) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }

  #modal-title {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: var(--gold);
    margin-bottom: 6px;
  }

  #modal-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }

  .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

  .btn-primary {
    background: linear-gradient(135deg, #4a8c3f, #2a5a20);
    border: 1px solid var(--green);
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .btn-primary:hover { box-shadow: var(--glow-green); transform: translateY(-1px); }

  .btn-secondary {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

  .btn-danger {
    background: linear-gradient(135deg, #5a1a1a, #3a1010);
    border: 1px solid var(--red);
    color: var(--red-light);
    font-family: 'Cinzel', serif;
    font-size: 12px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  /* CROP SEED BUTTONS */
  .seed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .seed-btn {
    background: var(--bg-mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    text-align: left;
    font-family: 'Crimson Text', serif;
  }

  .seed-btn:hover:not(:disabled) { border-color: var(--green); background: var(--bg-card); }
  .seed-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .seed-btn .s-top { display: flex; align-items: center; gap: 6px; }
  .seed-btn .s-emoji { font-size: 22px; }
  .seed-btn .s-name { font-size: 13px; color: var(--text-bright); font-weight: 600; }
  .seed-btn .s-time { font-size: 11px; color: var(--gold); }
  .seed-btn .s-xp { font-size: 11px; color: var(--green-light); }
  .seed-btn .s-cost { font-size: 10px; color: var(--text-dim); }

  /* TOAST */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    display: flex;
    flex-direction: column-reverse;
    gap: 8px;
  }

  .toast {
    background: var(--bg-panel);
    border: 1px solid var(--border-light);
    border-radius: 10px;
    padding: 12px 18px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    color: var(--text-bright);
    box-shadow: var(--shadow);
    animation: toast-in 0.3s ease, toast-out 0.3s ease 2.7s forwards;
    max-width: 300px;
  }

  .toast.success { border-color: var(--green); color: var(--green-light); }
  .toast.error { border-color: var(--red); color: var(--red-light); }
  .toast.gold { border-color: var(--gold); color: var(--gold-light); }

  @keyframes toast-in { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
  @keyframes toast-out { to { opacity:0; transform:translateX(40px); } }

  /* RESOURCE BARS */
  .res-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid rgba(107,76,30,0.3);
    font-size: 13px;
  }

  .res-row:last-child { border-bottom: none; }
  .res-left { display: flex; align-items: center; gap: 6px; }
  .res-emoji { font-size: 18px; }
  .res-name { color: var(--text-dim); }
  .res-val { color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; }

  /* COOKING ACTIVE */
  .cooking-active {
    background: linear-gradient(135deg, #1a2a10, #0f1a08);
    border: 1px solid var(--green);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cooking-active .ca-emoji { font-size: 26px; }
  .cooking-active .ca-info { flex: 1; }
  .cooking-active .ca-name { font-family: 'Cinzel', serif; font-size: 12px; color: var(--green-light); }
  .cooking-active .ca-timer { font-size: 11px; color: var(--text-dim); }

  .eat-btn {
    background: linear-gradient(135deg, #4a6020, #2a4010);
    border: 1px solid var(--green);
    color: var(--green-light);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .eat-btn:hover { box-shadow: var(--glow-green); }
  .eat-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* NODE CELL */
  .node-cooldown { font-size: 9px; color: var(--text-dim); }

  /* SKILL TREE */
  .skill-tree-container { display: flex; flex-direction: column; gap: 8px; }
  .skill-pillar { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .pillar-name { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold); margin-bottom: 6px; }
  .skill-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .skill-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg-mid); border: 2px solid var(--border);
    flex-shrink: 0; cursor: pointer; transition: all 0.2s;
  }
  .skill-dot.unlocked { background: var(--green); border-color: var(--green-light); box-shadow: 0 0 8px var(--green); }
  .skill-dot.available { border-color: var(--gold); animation: pulse-gold 1.5s infinite; }
  @keyframes pulse-gold { 0%,100%{box-shadow:0 0 3px var(--gold);} 50%{box-shadow:0 0 10px var(--gold);} }
  .skill-info { font-size: 11px; }
  .skill-name { color: var(--text); }
  .skill-pts { color: var(--text-dim); font-size: 10px; }

  /* SCROLL STYLE */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* LEVEL UP FLASH */
  #level-up-flash {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(212,160,23,0.15);
    z-index: 150;
    pointer-events: none;
    animation: level-flash 1s ease forwards;
  }

  @keyframes level-flash {
    0% { opacity: 0; }
    30% { opacity: 1; }
    100% { opacity: 0; }
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
  }

  .tab-btn {
    flex: 1;
    background: var(--bg-mid);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    padding: 5px 4px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .tab-btn.active { background: var(--bg-card); border-color: var(--gold); color: var(--gold); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }
</style>
</head>
<body>

<!-- LEVEL UP FLASH -->
<div id="level-up-flash"></div>

<!-- HEADER -->
<div id="header">
  <h1>⚗️ EVOLUTION ERA <span>— Stone Age</span></h1>
  <div id="player-stats">
    <div class="stat-pill"><span class="icon">⚔️</span> Lvl <span class="val" id="hdr-level">1</span></div>
    <div class="stat-pill"><span class="icon">🪙</span> <span class="val" id="hdr-kodi">0</span> Kodi</div>
    <div id="xp-bar-wrap">
      <div id="xp-bar" style="width:0%"></div>
      <div id="xp-text">0 / 100 XP</div>
    </div>
    <div class="stat-pill"><span class="icon">🎯</span> SP: <span class="val" id="hdr-sp">0</span></div>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- LEFT: INVENTORY -->
  <div class="panel" id="left-panel">
    <div class="panel-title">📦 Inventory</div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('resources')">Resources</button>
      <button class="tab-btn" onclick="switchTab('crops')">Crops</button>
      <button class="tab-btn" onclick="switchTab('food')">Food</button>
      <button class="tab-btn" onclick="switchTab('skills')">Skills</button>
    </div>

    <!-- RESOURCES TAB -->
    <div class="tab-content active" id="tab-resources">
      <div id="res-list"></div>
    </div>

    <!-- CROPS TAB -->
    <div class="tab-content" id="tab-crops">
      <div class="inv-grid" id="crop-inv"></div>
    </div>

    <!-- FOOD TAB -->
    <div class="tab-content" id="tab-food">
      <div id="food-inv"></div>
    </div>

    <!-- SKILLS TAB -->
    <div class="tab-content" id="tab-skills">
      <div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">
        Skill Points: <span style="color:var(--gold-light);font-weight:600;" id="sp-display">0</span>
      </div>

// SAVE / LOAD
// ══════════════════════════════════════════════

function saveGame() {
  G.lastSave = Date.now();
  localStorage.setItem('evolution_era_save', JSON.stringify(G));
}

function loadGame() {
  const s = localStorage.getItem('evolution_era_save');
  if (!s) return null;
  try { return JSON.parse(s); } catch(e) { return null; }
}

// ══════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════

function now() { return Math.floor(Date.now() / 1000); }

function formatTime(sec) {
  if (sec <= 0) return 'Ready!';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm ' + (sec%60) + 's';
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  return h + 'h ' + m + 'm';
}

function toast(msg, type='') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3100);
}

function log(msg) {
  G.actionLog.unshift('• ' + msg);
  if (G.actionLog.length > 20) G.actionLog.pop();
  renderLog();
}

function renderLog() {
  const el = document.getElementById('action-log');
  if (el) el.innerHTML = G.actionLog.slice(0,15).join('<br>');
}

function xpForLevel(lvl) { return XP_TABLE[lvl] || 999999; }
function hasSkill(id) { return G.unlockedSkills.includes(id); }

function cookTimeMultiplier() {
  let m = 1;
  if (hasSkill('quick_hands')) m *= 0.9;
  if (hasSkill('master_chef')) m *= 0.75;
  return m;
}

function resourceMultiplier(type) {
  let m = 1;
  if (hasSkill('forest_eye') && type === 'wood') m *= 1.15;
  if (hasSkill('grand_gatherer')) m *= 1.3;
  return m;
}

function yieldMultiplier(tier) {
  let m = 1;
  if (hasSkill('crop_sense') && tier === 1) m *= 1.1;
  if (hasSkill('harvest_lord')) m *= 1.25;
  return m;
}

// ══════════════════════════════════════════════
// XP & LEVELING
// ══════════════════════════════════════════════

function addXP(amount) {
  // Master Chef double XP chance
  if (hasSkill('master_chef') && Math.random() < 0.1) {
    amount *= 2;
    toast('⚡ Double XP! Master Chef procs!', 'gold');
  }
  G.xp += amount;
  checkLevelUp();
  updateHeader();
}

function checkLevelUp() {
  while (G.level < 25 && G.xp >= xpForLevel(G.level)) {
    G.level++;
    G.skillPoints++;
    showLevelUpFlash();
    toast(`🎉 Level Up! You are now Level ${G.level}!`, 'gold');
    log(`Reached Level ${G.level}!`);
    saveGame();
  }
}

function showLevelUpFlash() {
  const el = document.getElementById('level-up-flash');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 1000);
}

// ══════════════════════════════════════════════
// RENDER HEADER
// ══════════════════════════════════════════════

function updateHeader() {
  document.getElementById('hdr-level').textContent = G.level;
  document.getElementById('hdr-kodi').textContent = G.kodi;
  document.getElementById('hdr-sp').textContent = G.skillPoints;
  document.getElementById('sp-display').textContent = G.skillPoints;

  const curXP = G.xp - xpForLevel(G.level - 1);
  const needXP = xpForLevel(G.level) - xpForLevel(G.level - 1);
  const pct = Math.min(100, Math.floor((curXP / needXP) * 100));
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('xp-text').textContent = `${G.xp.toLocaleString()} / ${xpForLevel(G.level).toLocaleString()} XP`;
}

// ══════════════════════════════════════════════
// RENDER ISLAND GRID
// ══════════════════════════════════════════════

function renderGrid() {
  const grid = document.getElementById('island-grid');
  grid.innerHTML = '';

  // Create 5x5 grid
  for (let y = 0; y < 5; y++) {
    for (let x = 0; x < 5; x++) {
      const idata = ISLAND_DATA.find(i => i.x === x && i.y === y);
      const cell = document.createElement('div');
      cell.className = 'island-cell';

      if (!idata) {
        cell.classList.add('locked');
        grid.appendChild(cell);
        continue;
      }

      const unlocked = G.unlockedIslands.includes(idata.id);

      if (!unlocked) {
        cell.classList.add('locked');
        cell.onclick = () => showUnlockModal(idata);
        // Show unlock hint
        const hint = document.createElement('div');
        hint.style.cssText = 'font-size:9px;color:#6b4c1e;text-align:center;padding:4px;';
        hint.textContent = `Lvl ${idata.unlockLevel}`;
        cell.innerHTML = '';
        cell.appendChild(hint);
        grid.appendChild(cell);
        continue;
      }

      // HOME
      if (idata.content === 'home') {
        cell.classList.add('home-plot');
        cell.innerHTML = `<div class="cell-emoji">🏠</div><div class="cell-label">Home</div>`;
        grid.appendChild(cell);
        continue;
      }

      // PORTAL
      if (idata.content === 'portal') {
        cell.innerHTML = `<div class="cell-emoji">🌀</div><div class="cell-label">Year 2 Portal</div>`;
        cell.style.borderColor = '#a040ff';
        grid.appendChild(cell);
        continue;
      }

      // NODE ONLY
      if (idata.content === 'node' && idata.node) {
        const nd = NODE_INFO[idata.node];
        const lastH = G.nodes[idata.id] || 0;
        const coolRemain = Math.max(0, (lastH + nd.cooldown) - now());
        cell.classList.add(idata.node + '-node');
        if (coolRemain === 0) {
          cell.innerHTML = `<div class="cell-emoji">${nd.emoji}</div><div class="cell-label">${nd.name}</div><div class="cell-timer">Click!</div>`;
          cell.onclick = () => harvestNode(idata.id, idata.node);
        } else {
          cell.innerHTML = `<div class="cell-emoji">${nd.emoji}</div><div class="cell-label">${nd.name}</div><div class="node-cooldown">${formatTime(coolRemain)}</div>`;
        }
        grid.appendChild(cell);
        continue;
      }

      // CROP PLOT (with optional node)
      const plotState = G.plots[idata.id];

      if (idata.node && !plotState) {
        // Show as node if no crop planted
        const nd = NODE_INFO[idata.node];
        const lastH = G.nodes[`node_${idata.id}`] || 0;
        const coolRemain = Math.max(0, (lastH + nd.cooldown) - now());
        cell.classList.add(idata.node + '-node');
        if (coolRemain === 0) {
          cell.innerHTML = `<div class="cell-emoji">${nd.emoji}</div><div class="cell-label">${nd.name}</div><div class="cell-timer">⛏️ Mine</div>`;
          cell.onclick = () => harvestNode(`node_${idata.id}`, idata.node);
        } else {
          cell.innerHTML = `<div class="cell-emoji">${nd.emoji}</div><div class="cell-label">${nd.name}</div><div class="node-cooldown">${formatTime(coolRemain)}</div>`;
        }
        // Add "plant anyway" option
        const plantBtn = document.createElement('div');
        plantBtn.style.cssText = 'font-size:8px;color:var(--green);cursor:pointer;margin-top:2px;';
        plantBtn.textContent = '+ Plant';
        plantBtn.onclick = (e) => { e.stopPropagation(); showPlantModal(idata.id); };
        cell.appendChild(plantBtn);
        grid.appendChild(cell);
        continue;
      }

      if (!plotState) {
        // Empty plot
        cell.innerHTML = `<div class="cell-emoji">🌱</div><div class="cell-label">Empty</div><div class="cell-timer">Click to plant</div>`;
        cell.onclick = () => showPlantModal(idata.id);
      } else {
        const crop = CROPS[plotState.cropType];
        const elapsed = now() - plotState.plantedAt;
        const progress = Math.min(1, elapsed / crop.growTime);
        const remaining = Math.max(0, crop.growTime - elapsed);

        if (plotState.state === 'wilted') {
          cell.classList.add('wilted');
          cell.innerHTML = `<div class="cell-emoji">🥀</div><div class="cell-label">Wilted!</div><div class="cell-timer">50% yield</div>`;
          cell.onclick = () => harvestCrop(idata.id, true);
        } else if (progress >= 1) {
          cell.classList.add('ready');
          cell.innerHTML = `<div class="cell-emoji">${crop.emoji}</div><div class="cell-label">${crop.name}</div><div class="cell-timer">✅ Harvest!</div>`;
          cell.onclick = () => harvestCrop(idata.id, false);
        } else {
          cell.classList.add('has-crop');
          cell.innerHTML = `
            <div class="cell-emoji">${crop.emoji}</div>
            <div class="cell-label">${crop.name}</div>
            <div class="cell-timer">${formatTime(remaining)}</div>
            <div class="progress-bar-wrap"><div class="progress-bar" style="width:${Math.floor(progress*100)}%"></div></div>
          `;
        }
      }

      grid.appendChild(cell);
    }
  }
}

// ══════════════════════════════════════════════
// PLANT MODAL
// ══════════════════════════════════════════════

function showPlantModal(plotId) {
  const available = Object.entries(CROPS).filter(([k,c]) =>
    c.tier === 1 &&
    G.level >= c.unlockLevel &&
    (G.crops[k] || 0) > 0
  );

  document.getElementById('modal-title').textContent = '🌱 Plant a Crop';
  document.getElementById('modal-subtitle').textContent = 'Choose a seed to plant on this plot.';

  const body = document.createElement('div');
  body.className = 'seed-grid';

  if (available.length === 0) {
    body.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-dim);padding:12px;">No seeds available.<br>Buy seeds from Marketplace.</div>';
  }

  available.forEach(([key, crop]) => {
    const btn = document.createElement('button');
    btn.className = 'seed-btn';
    btn.innerHTML = `
      <div class="s-top"><span class="s-emoji">${crop.emoji}</span><span class="s-name">${crop.name}</span></div>
      <div class="s-time">⏱ ${formatTime(crop.growTime)}</div>
      <div class="s-xp">✨ ${crop.xp} XP</div>
    `;
    btn.onclick = () => { plantCrop(plotId, key); closeModal(); };
    body.appendChild(btn);
  });

  document.getElementById('modal-body').innerHTML = '';
  document.getElementById('modal-body').appendChild(body);

  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'btn-secondary';
  closeBtn.textContent = '✕ Cancel';
  closeBtn.onclick = closeModal;
  actions.appendChild(closeBtn);

  document.getElementById('modal-overlay').classList.add('show');
}

function plantCrop(plotId, cropType) {
  const crop = CROPS[cropType];

  if ((G.crops[cropType] || 0) <= 0) {
    toast('❌ No seeds available!', 'error');
    return;
  }

  // consume 1 seed
  G.crops[cropType]--;

  G.plots[plotId] = { cropType, plantedAt: now(), state: 'growing' };
  toast(`🌱 Planted ${crop.name}!`, 'success');
  log(`Planted ${crop.name} on plot ${plotId+1}`);
  saveGame();
  renderGrid();
}

function harvestCrop(plotId, wilted) {
  const plot = G.plots[plotId];
  if (!plot) return;
  const crop = CROPS[plot.cropType];
  let amount = Math.floor(yieldMultiplier(crop.tier));

  // Double harvest chance
  if (hasSkill('harvest_lord') && Math.random() < 0.05) {
    amount *= 2;
    toast('🌟 Double Harvest!', 'gold');
  }

  if (wilted) amount = Math.max(1, Math.floor(amount * 0.5));

  G.crops[plot.cropType] = (G.crops[plot.cropType] || 0) + amount;
  delete G.plots[plotId];

  // Reward XP + Kodi on harvest
  const harvestXP = crop.xp * amount;
  const harvestKodi = Math.max(1, Math.floor(crop.kodi * amount * 0.5));

  addXP(harvestXP);
  G.kodi += harvestKodi;

  toast(`🌾 Harvested ${amount}x ${crop.name}! +${harvestXP} XP +${harvestKodi} Kodi`, 'success');
  log(`Harvested ${amount}x ${crop.name} (+${harvestXP} XP)`);

  saveGame();
  renderGrid();
  renderInventory();
  renderMarketplace();
  updateHeader();
}

// ══════════════════════════════════════════════
// NODE HARVESTING
// ══════════════════════════════════════════════

function harvestNode(nodeKey, nodeType) {
  const nd = NODE_INFO[nodeType];
  const lastH = G.nodes[nodeKey] || 0;
  const coolRemain = Math.max(0, (lastH + nd.cooldown) - now());
  if (coolRemain > 0) { toast('⏳ Node on cooldown!', 'error'); return; }

  const base = nd.yield[0] + Math.floor(Math.random() * (nd.yield[1] - nd.yield[0]));
  const amount = Math.floor(base * resourceMultiplier(nd.resource));
  G.resources[nd.resource] = (G.resources[nd.resource] || 0) + amount;
  G.nodes[nodeKey] = now();

  toast(`⛏️ Got ${amount}x ${nd.name.split(' ')[0]}!`, 'success');
  log(`Mined ${amount}x ${nd.resource} from ${nd.name}`);
  saveGame();
  renderGrid();
  renderInventory();
}

// ══════════════════════════════════════════════
// UNLOCK MODAL
// ══════════════════════════════════════════════

function showUnlockModal(idata) {
  if (G.level < idata.unlockLevel) {
    toast(`⚔️ Need Level ${idata.unlockLevel} to unlock!`, 'error');
    return;
  }

  const cost = idata.unlockCost || {};
  // Apply Stone Sense discount
  const discount = hasSkill('stone_sense') ? 0.85 : 1;
  const finalCost = {};
  Object.entries(cost).forEach(([r,v]) => finalCost[r] = Math.ceil(v * discount));

  // Check if can afford
  const canAfford = Object.entries(finalCost).every(([r,v]) => (G.resources[r]||0) >= v);

  document.getElementById('modal-title').textContent = '🏝️ Unlock Island';
  document.getElementById('modal-subtitle').textContent = `Island ${idata.id + 1} — Level ${idata.unlockLevel} Required`;

  let costHtml = '<div style="margin:10px 0;font-size:13px;color:var(--text-dim);">Cost:</div>';
  Object.entries(finalCost).forEach(([r,v]) => {
    const have = G.resources[r] || 0;
    const ok = have >= v;
    const emoji = {wood:'🪵',stone:'🪨',iron:'⚙️',gold:'🥇'}[r];
    costHtml += `<div style="display:flex;justify-content:space-between;padding:4px 0;color:${ok?'var(--green-light)':'var(--red-light)'}">
      <span>${emoji} ${r.charAt(0).toUpperCase()+r.slice(1)}</span>
      <span>${have}/${v}</span>
    </div>`;
  });

  if (idata.building) {
    costHtml += `<div style="margin-top:8px;padding:6px;background:var(--bg-mid);border-radius:6px;font-size:12px;color:var(--gold);">
      🎁 Unlocks: ${BUILDINGS[idata.building]?.name || idata.building}
    </div>`;
  }
  if (idata.node) {
    const nd = NODE_INFO[idata.node];
    costHtml += `<div style="margin-top:4px;padding:6px;background:var(--bg-mid);border-radius:6px;font-size:12px;color:var(--text-dim);">
      ${nd.emoji} Contains: ${nd.name}
    </div>`;
  }

  document.getElementById('modal-body').innerHTML = costHtml;

  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';

  if (canAfford) {
    const unlockBtn = document.createElement('button');
    unlockBtn.className = 'btn-primary';
    unlockBtn.textContent = '🔓 Unlock Island!';
    unlockBtn.onclick = () => { unlockIsland(idata, finalCost); closeModal(); };
    actions.appendChild(unlockBtn);
  }

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-secondary';
  cancelBtn.textContent = canAfford ? '✕ Cancel' : '✕ Close (Need more resources)';
  cancelBtn.onclick = closeModal;
  actions.appendChild(cancelBtn);

  document.getElementById('modal-overlay').classList.add('show');
}

function unlockIsland(idata, cost) {
  Object.entries(cost).forEach(([r,v]) => G.resources[r] -= v);
  G.unlockedIslands.push(idata.id);

  if (idata.building) {
    G.unlockedBuildings.push(idata.building);
    toast(`🏗️ ${BUILDINGS[idata.building]?.name} unlocked!`, 'gold');
    log(`Unlocked ${BUILDINGS[idata.building]?.name}!`);
  }

  toast(`🏝️ Island ${idata.id + 1} unlocked!`, 'gold');
  log(`Unlocked Island ${idata.id + 1}`);
  saveGame();
  renderAll();
}

// ══════════════════════════════════════════════
// COOKING
// ══════════════════════════════════════════════

function renderBuildings() {
  const cont = document.getElementById('buildings-container');
  cont.innerHTML = '';

  Object.entries(BUILDINGS).forEach(([bId, bData]) => {
    const unlocked = true;

    const div = document.createElement('div');
    div.className = 'cooking-building';

    const cooking = G.buildings[bId];
    let statusHtml = '';

    if (cooking) {
      const recipe = RECIPES[cooking.recipe];
      const elapsed = now() - cooking.startedAt;
      const totalTime = Math.floor(recipe.cookTime * cookTimeMultiplier());
      const remaining = Math.max(0, totalTime - elapsed);
      const done = remaining === 0;

      statusHtml = `
        <div class="cooking-active">
          <div class="ca-emoji">${recipe.emoji}</div>
          <div class="ca-info">
            <div class="ca-name">${recipe.name}</div>
            <div class="ca-timer">${done ? '✅ Done!' : '⏱ ' + formatTime(remaining)}</div>
          </div>
          <button class="eat-btn" ${done?'':'disabled'} onclick="collectCooked('${bId}')">
            ${done ? '🍽️ Collect' : '⏳'}
          </button>
        </div>
      `;
    }

    div.innerHTML = `
      <div class="building-header">
        <div class="building-emoji">${bData.emoji}</div>
        <div>
          <div class="building-name">${bData.name}</div>
          <div class="building-status">${cooking ? 'Cooking...' : 'Ready to cook'}</div>
        </div>
      </div>
      ${statusHtml}
      ${!cooking ? '<div class="recipe-grid" id="recipes-' + bId + '"></div>' : ''}
    `;

    cont.appendChild(div);

    if (!cooking) {
      const rGrid = document.getElementById('recipes-' + bId);
      bData.recipes.forEach(rId => {
        const recipe = RECIPES[rId];
        if (!recipe) return;

        const canCook = Object.entries(recipe.ingredients).every(([crop, amt]) =>
          (G.crops[crop] || 0) >= amt
        );

        const btn = document.createElement('button');
        btn.className = 'recipe-btn';
        btn.disabled = !canCook;
        btn.innerHTML = `
          <div class="r-emoji">${recipe.emoji}</div>
          <span class="r-name">${recipe.name}</span>
          <div class="r-xp">+${recipe.xp} XP</div>
          <div style="font-size:9px;color:var(--text-dim);margin-top:2px;">
            ${Object.entries(recipe.ingredients).map(([c,a]) => a + 'x ' + CROPS[c].emoji).join(' ')}
          </div>
        `;
        btn.title = Object.entries(recipe.ingredients).map(([c,a]) => `${a}x ${CROPS[c]?.name||c}`).join(', ');
        btn.onclick = () => startCooking(bId, rId);
        rGrid.appendChild(btn);
      });
    }
  });
}

function startCooking(bId, rId) {
  const recipe = RECIPES[rId];
  // Deduct ingredients
  const ok = Object.entries(recipe.ingredients).every(([crop, amt]) => (G.crops[crop]||0) >= amt);
  if (!ok) { toast('❌ Not enough ingredients!', 'error'); return; }

  Object.entries(recipe.ingredients).forEach(([crop, amt]) => {
    G.crops[crop] = Math.max(0, (G.crops[crop] || 0) - amt);
  });

  G.buildings[bId] = { recipe: rId, startedAt: now() };
  toast(`🔥 Cooking ${recipe.name}...`, 'success');
  log(`Started cooking ${recipe.name}`);
  saveGame();
  renderBuildings();
  renderMarketplace();
  renderInventory();
}

function collectCooked(bId) {
  const cooking = G.buildings[bId];
  if (!cooking) return;
  const recipe = RECIPES[cooking.recipe];
  G.food[cooking.recipe] = (G.food[cooking.recipe] || 0) + 1;
  delete G.buildings[bId];
  toast(`✅ ${recipe.name} ready! Eat it to gain XP.`, 'success');
  log(`Collected ${recipe.name}`);
  saveGame();
  renderBuildings();
  renderInventory();
}

function eatFood(recipeId) {
  if ((G.food[recipeId] || 0) <= 0) { toast('❌ No food to eat!', 'error'); return; }
  const recipe = RECIPES[recipeId];
  G.food[recipeId]--;
  if (G.food[recipeId] <= 0) delete G.food[recipeId];
  addXP(recipe.xp);
  toast(`🍽️ Ate ${recipe.name}! +${recipe.xp} XP`, 'success');
  log(`Ate ${recipe.name} (+${recipe.xp} XP)`);
  saveGame();
  renderInventory();
  updateHeader();
}

// ══════════════════════════════════════════════
// INVENTORY RENDER
// ══════════════════════════════════════════════

function renderInventory() {
  // Resources tab
  const resList = document.getElementById('res-list');
  const resources = [
    { key:'wood',  emoji:'🪵', name:'Wood' },
    { key:'stone', emoji:'🪨', name:'Stone' },
    { key:'iron',  emoji:'⚙️', name:'Iron' },
    { key:'gold',  emoji:'🥇', name:'Gold' },
  ];
  resList.innerHTML = resources.map(r => `
    <div class="res-row">
      <div class="res-left"><span class="res-emoji">${r.emoji}</span><span class="res-name">${r.name}</span></div>
      <span class="res-val">${G.resources[r.key] || 0}</span>
    </div>
  `).join('');

  // Crops tab
  const cropInv = document.getElementById('crop-inv');
  cropInv.innerHTML = '';
  Object.entries(CROPS).forEach(([key, crop]) => {
    const count = G.crops[key] || 0;
    if (count === 0 && G.level < crop.unlockLevel) return;
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.innerHTML = `<div class="i-emoji">${crop.emoji}</div><div class="i-count">${count}</div><div class="i-name">${crop.name}</div>`;
    cropInv.appendChild(div);
  });

  // Food tab
  const foodInv = document.getElementById('food-inv');
  foodInv.innerHTML = '';
  if (Object.keys(G.food).length === 0) {
    foodInv.innerHTML = '<div style="font-size:12px;color:var(--text-dim);text-align:center;padding:10px;">No cooked food yet.<br>Cook something first!</div>';
  } else {
    Object.entries(G.food).forEach(([rId, count]) => {
      if (count <= 0) return;
      const recipe = RECIPES[rId];
      if (!recipe) return;
      const div = document.createElement('div');
      div.className = 'cooking-active';
      div.style.marginBottom = '6px';
      div.innerHTML = `
        <div class="ca-emoji">${recipe.emoji}</div>
        <div class="ca-info">
          <div class="ca-name">${recipe.name}</div>
          <div class="ca-timer">+${recipe.xp} XP each • ${count} in bag</div>
        </div>
        <button class="eat-btn" onclick="eatFood('${rId}')">🍽️ Eat</button>
      `;
      foodInv.appendChild(div);
    });
  }

  // Skill Tree tab
  renderSkillTree();
}

// ══════════════════════════════════════════════
// SKILL TREE RENDER
// ══════════════════════════════════════════════

function renderSkillTree() {
  const cont = document.getElementById('skill-tree');
  cont.innerHTML = '';

  SKILL_TREE.forEach(pillar => {
    const div = document.createElement('div');
    div.className = 'skill-pillar';

    let prevUnlocked = true;
    const skillsHtml = pillar.skills.map((skill, idx) => {
      const isUnlocked = hasSkill(skill.id);
      const canUnlock = !isUnlocked && prevUnlocked &&
        G.level >= skill.lvlReq && G.skillPoints >= skill.pts;
      const dotClass = isUnlocked ? 'unlocked' : (canUnlock ? 'available' : '');

      if (!isUnlocked) prevUnlocked = false;

      return `
        <div class="skill-row" onclick="${canUnlock ? `unlockSkill('${skill.id}',${skill.pts})` : isUnlocked ? '' : `showSkillInfo('${skill.id}')`}" style="cursor:${canUnlock||isUnlocked?'pointer':'default'}">
          <div class="skill-dot ${dotClass}"></div>
          <div class="skill-info">
            <div class="skill-name">${isUnlocked ? '✅ ' : ''}${skill.name}</div>
            <div class="skill-pts">${skill.pts}pt • Lvl ${skill.lvlReq} • ${skill.effect}</div>
          </div>
        </div>
      `;
    }).join('');

    div.innerHTML = `<div class="pillar-name">${pillar.pillar}</div>${skillsHtml}`;
    cont.appendChild(div);
  });
}

function unlockSkill(skillId, pts) {
  if (G.skillPoints < pts) { toast('❌ Not enough Skill Points!', 'error'); return; }
  if (hasSkill(skillId)) { toast('Already unlocked!', 'error'); return; }
  G.skillPoints -= pts;
  G.unlockedSkills.push(skillId);
  const skill = SKILL_TREE.flatMap(p => p.skills).find(s => s.id === skillId);
  toast(`🎯 Skill Unlocked: ${skill?.name}!`, 'gold');
  log(`Unlocked skill: ${skill?.name}`);
  saveGame();
  renderSkillTree();
  updateHeader();
}

function showSkillInfo(skillId) {
  const skill = SKILL_TREE.flatMap(p => p.skills).find(s => s.id === skillId);
  if (!skill) return;
  toast(`🔒 ${skill.name}: Need Lvl ${skill.lvlReq} + ${skill.pts} SP + previous skill`, 'error');
}

// ══════════════════════════════════════════════
// NPC ORDERS
// ══════════════════════════════════════════════

function renderNPCs() {
  const cont = document.getElementById('npc-container');
  cont.innerHTML = '';

  NPCS.forEach(npc => {
    if (npc.minLevel && G.level < npc.minLevel) return;

    // Get current order
    if (!G.npcOrders[npc.id]) {
      G.npcOrders[npc.id] = { orderIdx: Math.floor(Math.random() * npc.orders.length), assignedAt: now() };
    }

    const orderData = G.npcOrders[npc.id];
    const order = npc.orders[orderData.orderIdx % npc.orders.length];
    const timeLeft = Math.max(0, (orderData.assignedAt + npc.orderInterval) - now());
    const recipe = RECIPES[order.want];
    const haveFood = (G.food[order.want] || 0) >= order.amount;

    const div = document.createElement('div');
    div.className = 'npc-card';
    div.innerHTML = `
      <div class="npc-header">
        <div class="npc-avatar">${npc.emoji}</div>
        <div>
          <div class="npc-name">${npc.name}</div>
          <div class="npc-wants">${npc.desc}</div>
        </div>
      </div>
      <div class="npc-order">
        <div style="color:var(--text-bright);margin-bottom:4px;">${recipe?.emoji || '?'} ${order.label}</div>
        <div style="color:var(--gold);font-size:11px;">💰 Reward: ${order.reward} Kodi</div>
        <div style="color:var(--text-dim);font-size:10px;margin-top:2px;">
          Have: ${G.food[order.want]||0}/${order.amount} •
          ${timeLeft > 0 ? 'Expires: ' + formatTime(timeLeft) : '⏰ Expired — new order coming!'}
        </div>
      </div>
      <button class="deliver-btn" ${haveFood ? '' : 'disabled'} onclick="deliverToNPC('${npc.id}')">
        ${haveFood ? '✅ Deliver!' : '❌ Not enough food'}
      </button>
    `;
    cont.appendChild(div);
  });
}

function deliverToNPC(npcId) {
  const npc = NPCS.find(n => n.id === npcId);
  const orderData = G.npcOrders[npcId];
  const order = npc.orders[orderData.orderIdx % npc.orders.length];

  if ((G.food[order.want] || 0) < order.amount) {
    toast('❌ Not enough food!', 'error');
    return;
  }

  G.food[order.want] -= order.amount;
  if (G.food[order.want] <= 0) delete G.food[order.want];
  G.kodi += order.reward;

  // Assign new order
  G.npcOrders[npcId] = {
    orderIdx: (orderData.orderIdx + 1) % npc.orders.length,
    assignedAt: now()
  };

  toast(`✅ Delivered to ${npc.name}! +${order.reward} Kodi`, 'gold');
  log(`Delivered ${order.label} to ${npc.name} (+${order.reward} Kodi)`);
  saveGame();
  renderNPCs();
  updateHeader();
  renderInventory();
}

// ══════════════════════════════════════════════
// WILT CHECK
// ══════════════════════════════════════════════

function checkWilt() {
  let changed = false;
  Object.entries(G.plots).forEach(([plotId, plot]) => {
    if (plot.state === 'wilted') return;
    const crop = CROPS[plot.cropType];
    if (!crop) return;
    const elapsed = now() - plot.plantedAt;
    const wiltTime = crop.growTime * 2; // wilt at 2x grow time
    if (elapsed > crop.growTime + wiltTime) {
      G.plots[plotId].state = 'wilted';
      changed = true;
    }
  });
  if (changed) { saveGame(); renderGrid(); }
}

// ══════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    const tabs = ['resources','crops','food','skills'];
    b.classList.toggle('active', tabs[i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === 'tab-' + tab);
  });
  if (tab === 'skills') renderSkillTree();
}

// ══════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ══════════════════════════════════════════════
// RENDER ALL
// ══════════════════════════════════════════════

function renderAll() {
  updateHeader();
  renderGrid();
  renderBuildings();
  renderInventory();
  renderNPCs();
  renderLog();
}

// ══════════════════════════════════════════════
// GAME LOOP
// ══════════════════════════════════════════════

function gameLoop() {
  checkWilt();
  renderGrid();
  renderBuildings();
  renderNPCs();
  updateHeader();
}

// ══════════════════════════════════════════════
// STARTER BONUS
// ══════════════════════════════════════════════

function applyStarterBonus() {
  if (G.actionLog.length === 0) {
    // First time playing
    G.crops.potato = 10;
    G.crops.chilli = 5;
    G.resources.wood = 20;
    G.kodi = 200;
    log('Welcome to Evolution Era! You have starter crops & wood.');
    log('Plant crops → Cook food → Eat → Level Up!');
    log('Click locked islands to unlock them.');
    toast('🎮 Welcome! Start by planting a Potato!', 'gold');
    saveGame();
  }
}

// ══════════════════════════════════════════════
// CLEANUP BROKEN STATES
// ══════════════════════════════════════════════

function cleanupBrokenState() {
  Object.keys(G.buildings).forEach(key => {
    const b = G.buildings[key];
    if (!b || !RECIPES[b.recipe]) {
      delete G.buildings[key];
    }
  });

  Object.keys(G.food).forEach(key => {
    if (G.food[key] <= 0) delete G.food[key];
  });

  Object.keys(G.crops).forEach(key => {
    if (G.crops[key] < 0) G.crops[key] = 0;
  });
}



// ══════════════════════════════════════════════
// MARKETPLACE
// ══════════════════════════════════════════════

function renderMarketplace() {
  const cont = document.getElementById('market-container');
  if (!cont) return;

  const marketItems = [
    { crop:'potato', price:5 },
    { crop:'chilli', price:12 },
    { crop:'tomato', price:25 },
    { crop:'brinjal', price:35 },
    { crop:'cabbage', price:50 },
  ];

  cont.innerHTML = '';

  marketItems.forEach(item => {
    const crop = CROPS[item.crop];

    const box = document.createElement('div');
    box.className = 'cooking-building';
    box.innerHTML = `
      <div class="building-header">
        <div class="building-emoji">${crop.emoji}</div>
        <div>
          <div class="building-name">${crop.name} Seeds</div>
          <div class="building-status">Price: ${item.price} Kodi</div>
        </div>
      </div>

      <button class="btn-primary" onclick="buySeed('${item.crop}', ${item.price})">
        Buy Seed
      </button>
    `;

    cont.appendChild(box);
  });
}

function buySeed(cropType, price) {
  if (G.kodi < price) {
    toast('❌ Not enough Kodi!', 'error');
    return;
  }

  G.kodi -= price;

  G.crops[cropType] = (G.crops[cropType] || 0) + 1;

  toast(`🛒 Bought 1x ${CROPS[cropType].name}!`, 'success');
  log(`Purchased ${CROPS[cropType].name} seed`);

  saveGame();
  renderInventory();
  updateHeader();
}


// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════

cleanupBrokenState();
applyStarterBonus();
renderAll();
setInterval(gameLoop, 1000); // Update every second
setInterval(saveGame, 30000); // Auto-save every 30s

</script>
